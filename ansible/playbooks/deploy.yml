---
- hosts: all
  become: yes

  vars:
    app_dir: "/opt/devops-demo"
    jar_name: "devops-demo-0.3.0.jar"

  tasks:

    - name: Update apt cache
      apt:
        update_cache: yes

    - name: Install Java 17
      apt:
        name: openjdk-17-jdk
        state: present

    - name: Create application directory
      file:
        path: "{{ app_dir }}"
        state: directory
        mode: '0755'

    - name: Create bin directory
      file:
        path: "{{ app_dir }}/bin"
        state: directory
        mode: '0755'

    - name: Stop existing application
      shell: |
        pkill -f "{{ jar_name }}"
      ignore_errors: yes

    - name: Remove old JAR
      file:
        path: "{{ app_dir }}/{{ jar_name }}"
        state: absent

    - name: Copy application JAR
      copy:
        src: /home/azureuser/task/CICD_Ansible_Terraform_Azure/target/devops-demo-0.3.0.jar
        dest: "{{ app_dir }}/{{ jar_name }}"
        mode: '0755'

    - name: Start Spring Boot application
      shell: |
        nohup java -jar {{ app_dir }}/{{ jar_name }} --server.port=8080 > {{ app_dir }}/app.log 2>&1 &
      args:
        chdir: "{{ app_dir }}"

    - name: Wait for application to start
      wait_for:
        port: 8080
        delay: 5
        timeout: 60

    - name: Verify application is running
      shell: ss -tulnp | grep 8080
      register: app_status

    - debug:
        var: app_status.stdout

    - name: Health Check
      uri:
        url: "http://{{ inventory_hostname }}:8080/sayhi"
        method: GET
        status_code: 200
        return_content: yes
      register: health_check
      retries: 10
      delay: 5
      until: health_check.status == 200

    - name: Display Health Check Response
      debug:
       msg: "{{ health_check.content }}"
